name: Build EXE

on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller holidays

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --collect-all holidays --name "MatrixCalendar" calendar_clock.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MatrixCalendar
          path: dist/MatrixCalendar.exe
