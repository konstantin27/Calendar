name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name "MatrixCalendar" calendar_clock.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MatrixCalendar
          path: dist/MatrixCalendar.exe
